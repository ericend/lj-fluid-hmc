# .github/workflows/merge_gate.yaml
name: Merge gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Python lint ─────────────────────────────────
  lint-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check lint
        run: python -m ruff check .

  # ── 2. Python type check ───────────────────────────
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install typechecking dependencies
        run: python -m pip install numpy h5py matplotlib pytest pyright

      - name: Check committed extension stub exists
        run: |
          git ls-files --error-unmatch lj_hmc/_core.pyi
          test -s lj_hmc/_core.pyi

      - name: Run Pyright
        run: python -m pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

  # ── 3. Rust lint ───────────────────────────────────
  lint-rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Check Rust formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

  # ── 4. Build extension & run tests ─────────────────
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create build environment
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install maturin pytest numpy h5py matplotlib

      - name: Build Rust extension (debug)
        run: |
          source .venv-ci/bin/activate
          python -m maturin develop --manifest-path engine/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Python tests
        run: |
          source .venv-ci/bin/activate
          python -m pytest tests/ -v --tb=short

      - name: Check stubs are up to date
        run: |
          source .venv-ci/bin/activate

          # Ensure the required stub was committed, not just generated in CI.
          git ls-files --error-unmatch lj_hmc/_core.pyi

          python tools/gen_stubs.py

          if ! git diff --exit-code -- "*.pyi"; then
            echo "::error::Generated stubs differ from the committed versions."
            echo "Run the local merge gate, review the stubs, and commit them."
            exit 1
          fi

          untracked=$(git ls-files --others --exclude-standard -- "*.pyi")
          if [[ -n "$untracked" ]]; then
            echo "::error::Stub generation produced untracked files."
            printf '%s\n' "$untracked"
            exit 1
          fi

  # ── 5. Merge gate ──────────────────────────────────
  gate:
    if: always()
    needs: [lint-python, typecheck, lint-rust, build-test]
    runs-on: ubuntu-latest

    steps:
      - name: Check upstream jobs
        env:
          PYTHON_LINT_RESULT: ${{ needs.lint-python.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          RUST_LINT_RESULT: ${{ needs.lint-rust.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          printf '%-14s %s\n' \
            lint-python "$PYTHON_LINT_RESULT" \
            typecheck "$TYPECHECK_RESULT" \
            lint-rust "$RUST_LINT_RESULT" \
            build-test "$BUILD_TEST_RESULT"

          if [[ "$PYTHON_LINT_RESULT" != "success" ||
                "$TYPECHECK_RESULT" != "success" ||
                "$RUST_LINT_RESULT" != "success" ||
                "$BUILD_TEST_RESULT" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi

          echo "All jobs passed."
