# .github/workflows/Merge_gate.yaml
name: Merge gate

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ── 1. Python lint (Fast native Ruff binary) ───────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

  # ── 2. Python type check ───────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyright

      - name: Check committed extension stub exists
        run: |
          git ls-files --error-unmatch lj_hmc/_core.pyi
          test -s lj_hmc/_core.pyi

      - name: Run Pyright
        run: python -m pyright

  # ── 3. Rust lint ───────────────────────────────────
  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path engine/Cargo.toml -- -D warnings

  # ── 4. Build extension & run tests ─────────────────
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Set up virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Install build & test dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Rust extension (debug)
        run: python -m maturin develop --manifest-path engine/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path engine/Cargo.toml

      - name: Python tests
        run: python -m pytest tests/ -v --tb=short

      - name: Check stubs are up to date
        run: |
          git ls-files --error-unmatch lj_hmc/_core.pyi

          python tools/gen_stubs.py
          test -s lj_hmc/_core.pyi

          if ! git diff --exit-code -- "lj_hmc/*.pyi"; then
            echo "::error::Generated stubs differ from the committed versions."
            echo "Run the local merge gate, review the stubs, and commit them."
            exit 1
          fi

          untracked=$(git ls-files --others --exclude-standard -- "lj_hmc/*.pyi")
          if [[ -n "$untracked" ]]; then
            echo "::error::Untracked type stubs found in lj_hmc."
            printf '%s\n' "$untracked"
            exit 1
          fi

  # ── 5. Merge gate ──────────────────────────────────
  gate:
    if: always()
    needs: [lint-python, typecheck, lint-rust, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream jobs
        env:
          PYTHON_LINT_RESULT: ${{ needs.lint-python.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          RUST_LINT_RESULT: ${{ needs.lint-rust.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: |
          printf '%-14s %s\n' \
            lint-python "$PYTHON_LINT_RESULT" \
            typecheck "$TYPECHECK_RESULT" \
            lint-rust "$RUST_LINT_RESULT" \
            build-test "$BUILD_TEST_RESULT"

          if [[ "$PYTHON_LINT_RESULT" != "success" ||
                "$TYPECHECK_RESULT" != "success" ||
                "$RUST_LINT_RESULT" != "success" ||
                "$BUILD_TEST_RESULT" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi

          echo "All jobs passed."
