[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "lj-hmc"
version = "0.1.0"
requires-python = ">=3.12"
description = "LJ-HMC simulation with Rust physics kernels"

[tool.maturin]
manifest-path = "engine/Cargo.toml"
module-name = "lj_hmc._core"
python-source = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = ["typings"]

[tool.ruff]
extend-exclude = [
    "typings",
    ".venv-gate",
    "lj_hmc/_core.pyi",
]

[tool.ruff.lint]
extend-select = ["ANN"]
